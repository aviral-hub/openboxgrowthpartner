<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenBox GP - Java Fundamentals Learning Suite</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #334155;
            --accent-blue: #38bdf8;
            --accent-green: #4ade80;
            --accent-purple: #c084fc;
            --accent-red: #f87171;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #475569;
            --code-bg: #020617;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Navigation */
        aside.sidebar {
            width: 320px;
            background-color: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .brand {
            padding: 1.25rem;
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .brand-logo {
            background: var(--accent-blue);
            color: var(--bg-primary);
            font-weight: 800;
            padding: 0.4rem 0.6rem;
            border-radius: 6px;
            font-size: 1.1rem;
        }

        .brand-title {
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: -0.5px;
        }

        .progress-bar-container {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border);
            background: rgba(0,0,0,0.1);
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .progress-track {
            width: 100%;
            height: 8px;
            background: var(--bg-card);
            border-radius: 999px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-green));
            transition: width 0.4s ease;
        }

        .module-list {
            overflow-y: auto;
            flex: 1;
            padding: 0.75rem;
        }

        .module-item {
            margin-bottom: 0.5rem;
        }

        .module-btn {
            width: 100%;
            padding: 0.85rem 1rem;
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-main);
            text-align: left;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
        }

        .module-btn:hover {
            background: var(--bg-card);
        }

        .module-btn.active {
            background: var(--bg-card);
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        .module-status {
            font-size: 0.75rem;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            background: rgba(255,255,255,0.05);
        }

        /* Main Workspace Layout */
        main.workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header.topbar {
            height: 60px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
        }

        .tab-group {
            display: flex;
            gap: 0.5rem;
        }

        .tab-btn {
            padding: 0.5rem 1rem;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-weight: 600;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        .tab-btn.active {
            color: var(--accent-blue);
            border-bottom-color: var(--accent-blue);
        }

        .content-panel {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1px;
            background: var(--border);
            overflow: hidden;
        }

        /* Left Split: Documentation & Theory */
        .doc-view {
            background: var(--bg-primary);
            padding: 2rem;
            overflow-y: auto;
            line-height: 1.6;
        }

        .doc-view h1 {
            font-size: 1.8rem;
            color: var(--accent-blue);
            margin-bottom: 1rem;
        }

        .doc-view h2 {
            font-size: 1.3rem;
            color: var(--text-main);
            margin: 1.5rem 0 0.75rem 0;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.4rem;
        }

        .doc-view p, .doc-view ul {
            color: var(--text-muted);
            margin-bottom: 1rem;
            font-size: 0.95rem;
        }

        .doc-view ul {
            padding-left: 1.25rem;
        }

        .doc-view li {
            margin-bottom: 0.4rem;
        }

        .code-block {
            background: var(--code-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 1rem;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.875rem;
            color: #e2e8f0;
            margin: 1rem 0;
            overflow-x: auto;
        }

        /* Right Split: Task IDE & Terminal */
        .ide-view {
            background: var(--bg-secondary);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .task-card {
            background: var(--bg-primary);
            padding: 1.25rem;
            border-bottom: 1px solid var(--border);
        }

        .task-card h3 {
            color: var(--accent-purple);
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .task-card p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--code-bg);
            position: relative;
        }

        .editor-header {
            background: var(--bg-secondary);
            padding: 0.5rem 1rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        textarea.code-editor {
            flex: 1;
            background: transparent;
            color: #f1f5f9;
            border: none;
            padding: 1rem;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.95rem;
            resize: none;
            outline: none;
            line-height: 1.5;
        }

        .terminal-container {
            height: 180px;
            background: #000000;
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .terminal-header {
            background: #111827;
            padding: 0.4rem 1rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: flex;
            justify-content: space-between;
        }

        .terminal-output {
            flex: 1;
            padding: 0.75rem 1rem;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.85rem;
            color: var(--accent-green);
            overflow-y: auto;
            white-space: pre-wrap;
        }

        .action-bar {
            padding: 0.75rem 1rem;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
        }

        .btn {
            padding: 0.5rem 1.25rem;
            border-radius: 6px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.875rem;
        }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background: var(--border);
        }

        .btn-primary {
            background: var(--accent-blue);
            color: var(--bg-primary);
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        /* Quiz View Overlay Styling */
        .quiz-view {
            display: none;
            padding: 2rem;
            background: var(--bg-primary);
            overflow-y: auto;
            grid-column: span 2;
        }

        .quiz-container {
            max-width: 700px;
            margin: 0 auto;
        }

        .quiz-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .quiz-card h4 {
            margin-bottom: 1rem;
            color: var(--text-main);
        }

        .option-btn {
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-main);
            text-align: left;
            margin-bottom: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-btn:hover {
            border-color: var(--accent-blue);
        }

        .option-btn.correct {
            background: rgba(74, 222, 128, 0.15);
            border-color: var(--accent-green);
            color: var(--accent-green);
        }

        .option-btn.incorrect {
            background: rgba(248, 113, 113, 0.15);
            border-color: var(--accent-red);
            color: var(--accent-red);
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-logo">GP</div>
            <div class="brand-title">OpenBox GP Code</div>
        </div>

        <div class="progress-bar-container">
            <div class="progress-label">
                <span>Course Completion</span>
                <span id="progressText">0%</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <div class="module-list" id="moduleList">
            <!-- Dynamic Modules populated via JS -->
        </div>
    </aside>

    <!-- Main Workspace -->
    <main class="workspace">
        <header class="topbar">
            <div class="tab-group">
                <button class="tab-btn active" id="tabDoc" onclick="switchTab('doc')">Learning Docs & Task</button>
                <button class="tab-btn" id="tabQuiz" onclick="switchTab('quiz')">Module Quiz</button>
            </div>
            <div style="font-size: 0.85rem; color: var(--text-muted);" id="currentModuleTitle">
                Module 1: Java Architecture
            </div>
        </header>

        <div class="content-panel" id="contentPanel">
            <!-- Documentation View -->
            <div class="doc-view" id="docView">
                <!-- Content dynamically populated -->
            </div>

            <!-- Task IDE View -->
            <div class="ide-view" id="ideView">
                <div class="task-card">
                    <h3><span>🎯</span> Module Task</h3>
                    <p id="taskInstruction">Loading task instructions...</p>
                </div>

                <div class="editor-container">
                    <div class="editor-header">
                        <span>Main.java</span>
                        <span>Java SE 17</span>
                    </div>
                    <textarea class="code-editor" id="codeEditor" spellcheck="false"></textarea>
                </div>

                <div class="terminal-container">
                    <div class="terminal-header">
                        <span>Console Output</span>
                        <span id="terminalStatus" style="color: var(--text-muted);">Ready</span>
                    </div>
                    <div class="terminal-output" id="terminalOutput">Click "Run Code" to execute script...</div>
                </div>

                <div class="action-bar">
                    <button class="btn btn-secondary" onclick="resetEditor()">Reset</button>
                    <button class="btn btn-primary" onclick="runCode()">Run Code</button>
                    <button class="btn btn-primary" style="background: var(--accent-green);" onclick="submitTask()">Verify Task</button>
                </div>
            </div>

            <!-- Quiz View -->
            <div class="quiz-view" id="quizView">
                <div class="quiz-container" id="quizContainer">
                    <!-- Quiz populated dynamically -->
                </div>
            </div>
        </div>
    </main>

    <script>
        // Module Data Structure
        const courseData = [
            {
                id: 0,
                title: "01. Java Architecture",
                doc: `
                    <h1>Java Architecture & Foundations</h1>
                    <p>Java relies on a runtime ecosystem centered around the <strong>Java Virtual Machine (JVM)</strong> to deliver platform independence ("Write Once, Run Anywhere").</p>
                    
                    <h2>Key Components</h2>
                    <ul>
                        <li><strong>JDK (Java Development Kit):</strong> Tools to compile and develop programs (includes <code>javac</code>).</li>
                        <li><strong>JRE (Java Runtime Environment):</strong> Software libraries needed to run Java programs.</li>
                        <li><strong>JVM (Java Virtual Machine):</strong> Executes bytecode on the target operating system.</li>
                    </ul>

                    <h2>Execution Pipeline</h2>
                    <div class="code-block">
Source Code (.java) ➔ [javac] ➔ Bytecode (.class) ➔ [Class Loader] ➔ [Bytecode Verifier] ➔ [JVM Execution]
                    </div>
                `,
                task: "Print system metadata to confirm JVM initialization. Output the exact message: 'JVM Architecture Initialized'",
                defaultCode: `public class Main {\n    public static void main(String[] args) {\n        // Print required text below\n        System.out.println("");\n    }\n}`,
                expectedOutput: "JVM Architecture Initialized",
                quiz: [
                    {
                        q: "Which component converts Java Bytecode into native target machine instructions?",
                        options: ["Java Compiler (javac)", "Bytecode Verifier", "JVM Execution Engine", "Class Loader"],
                        correct: 2
                    },
                    {
                        q: "What is created after a .java file is compiled?",
                        options: [".exe file", ".class bytecode file", ".dll library", ".obj file"],
                        correct: 1
                    }
                ]
            },
            {
                id: 1,
                title: "02. Language Basics",
                doc: `
                    <h1>Java Language Basics</h1>
                    <p>Java is a strongly typed programming language. Every variable must have a declared data type.</p>

                    <h2>Primitive Data Types</h2>
                    <ul>
                        <li><code>int</code>: 4-byte integer numbers</li>
                        <li><code>double</code>: 8-byte floating point values</li>
                        <li><code>boolean</code>: Logical true/false state</li>
                        <li><code>char</code>: Single 16-bit Unicode character</li>
                    </ul>

                    <h2>Type Casting Example</h2>
                    <div class="code-block">
double rawPrice = 99.99;
int roundedPrice = (int) rawPrice; // Explicit narrowing cast
                    </div>
                `,
                task: "Declare an integer variable 'itemId' with value 101 and a double 'price' with value 49.5. Print them formatted as 'Item 101: $49.5'",
                defaultCode: `public class Main {\n    public static void main(String[] args) {\n        // Declare variables and print formatted output\n        \n    }\n}`,
                expectedOutput: "Item 101: $49.5",
                quiz: [
                    {
                        q: "Which data type is best suited to store precise 64-bit floating-point numbers?",
                        options: ["float", "int", "double", "long"],
                        correct: 2
                    }
                ]
            },
            {
                id: 2,
                title: "03. Flow Control",
                doc: `
                    <h1>Flow Control Statements</h1>
                    <p>Flow control manages program decision paths using conditions and loop structures.</p>

                    <h2>Decision Statements</h2>
                    <div class="code-block">
if (score >= 90) {
    System.out.println("Pass");
} else {
    System.out.println("Fail");
}
                    </div>

                    <h2>Iteration Structures</h2>
                    <p>Use <code>for</code> loops when execution count is known upfront.</p>
                `,
                task: "Write a for-loop that prints numbers from 1 to 3, each on a new line.",
                defaultCode: `public class Main {\n    public static void main(String[] args) {\n        // Write a loop from 1 to 3\n        \n    }\n}`,
                expectedOutput: "1\n2\n3",
                quiz: [
                    {
                        q: "Which loop is guaranteed to execute at least once?",
                        options: ["for loop", "while loop", "do-while loop", "for-each loop"],
                        correct: 2
                    }
                ]
            },
            {
                id: 3,
                title: "04. Arrays",
                doc: `
                    <h1>Arrays in Java</h1>
                    <p>Arrays store fixed-size elements of the same data type in contiguous memory space.</p>

                    <h2>Declaring Arrays</h2>
                    <div class="code-block">
int[] numbers = {10, 20, 30, 40};
System.out.println(numbers[0]); // Accesses first element (10)
                    </div>
                `,
                task: "Create an array containing integers {5, 10, 15}. Print the sum of these array elements.",
                defaultCode: `public class Main {\n    public static void main(String[] args) {\n        int[] nums = {5, 10, 15};\n        // Calculate and print the total sum\n        \n    }\n}`,
                expectedOutput: "30",
                quiz: [
                    {
                        q: "How do you access the total count of elements in an array named 'data'?",
                        options: ["data.size()", "data.length", "data.count()", "data.length()"],
                        correct: 1
                    }
                ]
            }
        ];

        // System State
        let currentModuleIndex = 0;
        let completedModules = new Set();

        // Elements
        const moduleListEl = document.getElementById('moduleList');
        const docViewEl = document.getElementById('docView');
        const taskInstructionEl = document.getElementById('taskInstruction');
        const codeEditorEl = document.getElementById('codeEditor');
        const terminalOutputEl = document.getElementById('terminalOutput');
        const terminalStatusEl = document.getElementById('terminalStatus');
        const quizContainerEl = document.getElementById('quizContainer');
        const progressFillEl = document.getElementById('progressFill');
        const progressTextEl = document.getElementById('progressText');
        const currentModuleTitleEl = document.getElementById('currentModuleTitle');

        // Initialize Suite
        function init() {
            renderSidebar();
            loadModule(0);
        }

        function renderSidebar() {
            moduleListEl.innerHTML = '';
            courseData.forEach((mod, idx) => {
                const btn = document.createElement('button');
                btn.className = `module-btn ${idx === currentModuleIndex ? 'active' : ''}`;
                btn.onclick = () => loadModule(idx);
                
                const isCompleted = completedModules.has(idx);
                btn.innerHTML = `
                    <span>${mod.title}</span>
                    <span class="module-status" style="${isCompleted ? 'color: var(--accent-green); font-weight: bold;' : ''}">
                        ${isCompleted ? '✓ Done' : 'Pending'}
                    </span>
                `;
                
                const wrapper = document.createElement('div');
                wrapper.className = 'module-item';
                wrapper.appendChild(btn);
                moduleListEl.appendChild(wrapper);
            });

            // Update Progress
            const pct = Math.round((completedModules.size / courseData.length) * 100);
            progressFillEl.style.width = `${pct}%`;
            progressTextEl.textContent = `${pct}%`;
        }

        function loadModule(index) {
            currentModuleIndex = index;
            const data = courseData[index];

            currentModuleTitleEl.textContent = data.title;
            docViewEl.innerHTML = data.doc;
            taskInstructionEl.textContent = data.task;
            codeEditorEl.value = data.defaultCode;
            terminalOutputEl.textContent = 'Click "Run Code" to execute script...';
            terminalStatusEl.textContent = 'Ready';
            
            renderQuiz(data.quiz);
            renderSidebar();
            switchTab('doc');
        }

        function switchTab(tab) {
            const docTab = document.getElementById('tabDoc');
            const quizTab = document.getElementById('tabQuiz');
            const docView = document.getElementById('docView');
            const ideView = document.getElementById('ideView');
            const quizView = document.getElementById('quizView');

            if (tab === 'doc') {
                docTab.classList.add('active');
                quizTab.classList.remove('active');
                docView.style.display = 'block';
                ideView.style.display = 'flex';
                quizView.style.display = 'none';
            } else {
                quizTab.classList.add('active');
                docTab.classList.remove('active');
                docView.style.display = 'none';
                ideView.style.display = 'none';
                quizView.style.display = 'block';
            }
        }

        // Code Sandbox Execution Engine (Simulated Parser)
        function simulateExecution(code) {
            // Extract System.out.println contents
            const printPattern = /System\.out\.println\s*\((.*?)\);/g;
            let matches;
            let logs = [];

            // Lightweight parser for simulation
            try {
                // Handle basic literal matches and variables
                if (code.includes('int itemId = 101') && code.includes('double price = 49.5')) {
                    if (code.includes('Item 101: $49.5')) return "Item 101: $49.5";
                }
                if (code.includes('for') && code.includes('1') && code.includes('3')) {
                    return "1\n2\n3";
                }
                if (code.includes('nums') && (code.includes('30') || code.includes('+'))) {
                    return "30";
                }

                while ((matches = printPattern.exec(code)) !== null) {
                    let val = matches[1].trim();
                    // Strip quotes if string literal
                    if (val.startsWith('"') && val.endsWith('"')) {
                        val = val.substring(1, val.length - 1);
                    }
                    logs.push(val);
                }

                return logs.length > 0 ? logs.join('\n') : "Program executed successfully with no output.";
            } catch (err) {
                return "Compilation Error: Unexpected syntax encountered.";
            }
        }

        function runCode() {
            terminalStatusEl.textContent = 'Compiling...';
            terminalStatusEl.style.color = 'var(--accent-blue)';
            
            setTimeout(() => {
                const code = codeEditorEl.value;
                const output = simulateExecution(code);
                terminalOutputEl.textContent = output;
                terminalStatusEl.textContent = 'Execution finished';
                terminalStatusEl.style.color = 'var(--text-muted)';
            }, 300);
        }

        function submitTask() {
            const code = codeEditorEl.value;
            const output = simulateExecution(code).trim();
            const expected = courseData[currentModuleIndex].expectedOutput.trim();

            if (output === expected) {
                terminalOutputEl.textContent = `[SUCCESS] Output matched expected results!\n\nOutput:\n${output}`;
                completedModules.add(currentModuleIndex);
                renderSidebar();
            } else {
                terminalOutputEl.textContent = `[FAILED] Output mismatch.\n\nExpected:\n${expected}\n\nActual Output:\n${output}`;
            }
        }

        function resetEditor() {
            codeEditorEl.value = courseData[currentModuleIndex].defaultCode;
            terminalOutputEl.textContent = 'Editor reset to initial code.';
        }

        function renderQuiz(quizData) {
            quizContainerEl.innerHTML = '<h2 style="margin-bottom: 1.5rem; color: var(--accent-blue);">Module Knowledge Check</h2>';
            
            quizData.forEach((q, qIdx) => {
                const card = document.createElement('div');
                card.className = 'quiz-card';
                
                let optionsHTML = '';
                q.options.forEach((opt, oIdx) => {
                    optionsHTML += `
                        <button class="option-btn" onclick="answerQuiz(this, ${qIdx}, ${oIdx}, ${q.correct})">
                            ${opt}
                        </button>
                    `;
                });

                card.innerHTML = `
                    <h4>${qIdx + 1}. ${q.q}</h4>
                    <div>${optionsHTML}</div>
                `;
                quizContainerEl.appendChild(card);
            });
        }

        function answerQuiz(btn, qIdx, oIdx, correctIdx) {
            const parent = btn.parentElement;
            const buttons = parent.querySelectorAll('.option-btn');
            
            buttons.forEach((b) => {
                b.disabled = true;
                b.classList.remove('correct', 'incorrect');
            });

            if (oIdx === correctIdx) {
                btn.classList.add('correct');
            } else {
                btn.classList.add('incorrect');
                buttons[correctIdx].classList.add('correct');
            }
        }

        // Initialize application
        window.onload = init;
    </script>
</body>
</html>
