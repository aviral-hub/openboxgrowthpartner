<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Openbox Academy | Student Portal</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Inter, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, #273c75, transparent 35%),
        radial-gradient(circle at bottom right, #192a56, transparent 35%),
        #0b1020;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
    }

    .container {
      width: 100%;
      max-width: 460px;
    }

    .brand {
      text-align: center;
      margin-bottom: 25px;
    }

    .brand-logo {
      width: 60px;
      height: 60px;
      border-radius: 18px;
      background: white;
      color: #111827;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: auto;
      font-weight: 900;
      font-size: 24px;
    }

    .brand h1 {
      margin-top: 14px;
      font-size: 26px;
    }

    .brand p {
      color: #aab3c5;
      margin-top: 5px;
      font-size: 14px;
    }

    .card {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 30px 80px rgba(0,0,0,.4);
    }

    .tabs {
      display: flex;
      background: rgba(0,0,0,.2);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 25px;
    }

    .tab {
      flex: 1;
      padding: 11px;
      border: 0;
      background: transparent;
      color: #9ca3af;
      border-radius: 9px;
      cursor: pointer;
      font-weight: 600;
    }

    .tab.active {
      background: white;
      color: #111827;
    }

    h2 {
      margin-bottom: 8px;
    }

    .subtitle {
      color: #9ca3af;
      font-size: 14px;
      margin-bottom: 22px;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      color: #cbd5e1;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.25);
      color: white;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #60a5fa;
    }

    input::placeholder {
      color: #64748b;
    }

    .btn {
      width: 100%;
      border: none;
      padding: 15px;
      border-radius: 12px;
      background: white;
      color: #111827;
      font-weight: 800;
      cursor: pointer;
      margin-top: 5px;
      transition: .2s;
    }

    .btn:hover {
      transform: translateY(-1px);
      opacity: .95;
    }

    .btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .message {
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 15px;
      display: none;
      font-size: 14px;
    }

    .success {
      background: rgba(34,197,94,.15);
      color: #86efac;
    }

    .error {
      background: rgba(239,68,68,.15);
      color: #fca5a5;
    }

    .dashboard {
      display: none;
    }

    .profile {
      padding: 18px;
      background: rgba(0,0,0,.2);
      border-radius: 15px;
      margin-bottom: 18px;
    }

    .profile-name {
      font-size: 20px;
      font-weight: 800;
    }

    .profile-email {
      color: #94a3b8;
      font-size: 13px;
      margin-top: 4px;
    }

    .status-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 18px;
    }

    .status-card {
      background: rgba(0,0,0,.2);
      padding: 18px;
      border-radius: 15px;
    }

    .status-label {
      font-size: 12px;
      color: #94a3b8;
    }

    .status-value {
      font-size: 20px;
      font-weight: 800;
      margin-top: 6px;
    }

    .course-btn {
      display: block;
      width: 100%;
      text-align: center;
      text-decoration: none;
      padding: 15px;
      background: white;
      color: #111827;
      border-radius: 12px;
      font-weight: 800;
      margin-top: 10px;
    }

    .logout {
      background: transparent;
      border: 1px solid rgba(255,255,255,.15);
      color: #cbd5e1;
    }

    .small {
      margin-top: 18px;
      color: #64748b;
      text-align: center;
      font-size: 11px;
    }

    .hidden {
      display: none !important;
    }

  </style>

</head>

<body>

<div class="container">

  <div class="brand">
    <div class="brand-logo">OB</div>
    <h1>Openbox Academy</h1>
    <p>Python Programming Fundamentals</p>
  </div>

  <!-- LOGIN / REGISTER -->

  <div class="card" id="authCard">

    <div class="tabs">

      <button
        class="tab active"
        id="loginTab"
        onclick="showLogin()">
        Login
      </button>

      <button
        class="tab"
        id="registerTab"
        onclick="showRegister()">
        New Student
      </button>

    </div>


    <!-- LOGIN -->

    <div id="loginForm">

      <h2>Welcome back</h2>

      <p class="subtitle">
        Login to continue your learning journey.
      </p>

      <div id="loginMessage" class="message"></div>

      <div class="field">

        <label>Mobile Number</label>

        <input
          type="tel"
          id="loginMobile"
          maxlength="10"
          placeholder="Enter your 10-digit mobile number">

      </div>

      <div class="field">

        <label>Password</label>

        <input
          type="password"
          id="loginPassword"
          maxlength="10"
          placeholder="Your mobile number">

      </div>

      <button
        class="btn"
        id="loginBtn"
        onclick="login()">

        Login

      </button>

    </div>


    <!-- REGISTER -->

    <div id="registerForm" class="hidden">

      <h2>Create your account</h2>

      <p class="subtitle">
        Register once to access the course and final assessment.
      </p>

      <div id="registerMessage" class="message"></div>


      <div class="field">

        <label>Full Name</label>

        <input
          type="text"
          id="registerName"
          placeholder="Enter your full name">

      </div>


      <div class="field">

        <label>Email Address</label>

        <input
          type="email"
          id="registerEmail"
          placeholder="you@example.com">

      </div>


      <div class="field">

        <label>Mobile Number</label>

        <input
          type="tel"
          id="registerMobile"
          maxlength="10"
          placeholder="10-digit mobile number">

      </div>


      <button
        class="btn"
        id="registerBtn"
        onclick="register()">

        Create Account

      </button>

    </div>

    <div class="small">
      Openbox Academy • Student Learning Portal
    </div>

  </div>


  <!-- DASHBOARD -->

  <div class="card dashboard" id="dashboard">

    <div class="profile">

      <div
        class="profile-name"
        id="studentName">
      </div>

      <div
        class="profile-email"
        id="studentEmail">
      </div>

    </div>


    <div class="status-grid">

      <div class="status-card">

        <div class="status-label">
          Course Status
        </div>

        <div
          class="status-value"
          id="courseStatus">
          Not Started
        </div>

      </div>


      <div class="status-card">

        <div class="status-label">
          Quiz Score
        </div>

        <div
          class="status-value"
          id="quizScore">
          —
        </div>

      </div>

    </div>


    <a
      class="course-btn"
      href="YOUR_COURSE_PAGE_URL">
      Continue Course
    </a>


    <a
      class="course-btn"
      href="YOUR_FINAL_TEST_URL">
      Final Test
    </a>


    <button
      class="course-btn logout"
      onclick="logout()">
      Logout
    </button>

  </div>

</div>


<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbw1vRidNJMGfv6uLTq1B9dR6uRbz4V9fgDf2UZpVRaeVLO31owMsRImL3vTz_Q57nkH/exec";


// ===============================
// SWITCH LOGIN
// ===============================

function showLogin() {

  document.getElementById("loginForm")
    .classList.remove("hidden");

  document.getElementById("registerForm")
    .classList.add("hidden");

  document.getElementById("loginTab")
    .classList.add("active");

  document.getElementById("registerTab")
    .classList.remove("active");
}


// ===============================
// SWITCH REGISTER
// ===============================

function showRegister() {

  document.getElementById("loginForm")
    .classList.add("hidden");

  document.getElementById("registerForm")
    .classList.remove("hidden");

  document.getElementById("loginTab")
    .classList.remove("active");

  document.getElementById("registerTab")
    .classList.add("active");
}


// ===============================
// MESSAGE
// ===============================

function showMessage(id, message, success) {

  const element = document.getElementById(id);

  element.innerText = message;

  element.className =
    "message " + (success ? "success" : "error");

  element.style.display = "block";
}


// ===============================
// REGISTER
// ===============================

async function register() {

  const name =
    document.getElementById("registerName").value.trim();

  const email =
    document.getElementById("registerEmail").value.trim();

  const mobile =
    document.getElementById("registerMobile").value.trim();

  if (!name || !email || !mobile) {

    showMessage(
      "registerMessage",
      "Please fill all fields.",
      false
    );

    return;
  }

  if (!/^[0-9]{10}$/.test(mobile)) {

    showMessage(
      "registerMessage",
      "Enter a valid 10-digit mobile number.",
      false
    );

    return;
  }

  const button =
    document.getElementById("registerBtn");

  button.disabled = true;
  button.innerText = "Creating account...";


  try {

    const result = await fetch(API_URL, {

      method: "POST",

      body: JSON.stringify({

        action: "register",

        name: name,

        email: email,

        mobile: mobile

      })

    });

    const data = await result.json();


    if (data.success) {

      showMessage(
        "registerMessage",
        "Account created successfully. Your mobile number is your password.",
        true
      );

      document.getElementById("registerName").value = "";
      document.getElementById("registerEmail").value = "";
      document.getElementById("registerMobile").value = "";

      setTimeout(() => {

        showLogin();

        document.getElementById("loginMobile").value =
          mobile;

        document.getElementById("loginPassword").value =
          mobile;

      }, 1500);

    } else {

      showMessage(
        "registerMessage",
        data.message,
        false
      );

    }

  } catch (error) {

    showMessage(
      "registerMessage",
      "Unable to connect to the server.",
      false
    );

  }


  button.disabled = false;
  button.innerText = "Create Account";
}


// ===============================
// LOGIN
// ===============================

async function login() {

  const mobile =
    document.getElementById("loginMobile").value.trim();

  const password =
    document.getElementById("loginPassword").value.trim();


  if (!mobile || !password) {

    showMessage(
      "loginMessage",
      "Enter your mobile number and password.",
      false
    );

    return;
  }


  const button =
    document.getElementById("loginBtn");

  button.disabled = true;
  button.innerText = "Logging in...";


  try {

    const result = await fetch(API_URL, {

      method: "POST",

      body: JSON.stringify({

        action: "login",

        mobile: mobile,

        password: password

      })

    });


    const data = await result.json();


    if (data.success) {

      localStorage.setItem(
        "openboxUser",
        JSON.stringify(data.data)
      );

      showDashboard(data.data);

    } else {

      showMessage(
        "loginMessage",
        data.message,
        false
      );

    }

  } catch (error) {

    showMessage(
      "loginMessage",
      "Unable to connect to the server.",
      false
    );

  }


  button.disabled = false;
  button.innerText = "Login";
}


// ===============================
// DASHBOARD
// ===============================

function showDashboard(user) {

  document.getElementById("authCard")
    .style.display = "none";

  document.getElementById("dashboard")
    .style.display = "block";


  document.getElementById("studentName")
    .innerText = user.name;

  document.getElementById("studentEmail")
    .innerText = user.email;


  document.getElementById("courseStatus")
    .innerText =
      user.status || "Not Started";


  document.getElementById("quizScore")
    .innerText =
      user.score !== ""
        ? user.score + "%"
        : "—";
}


// ===============================
// LOGOUT
// ===============================

function logout() {

  localStorage.removeItem("openboxUser");

  location.reload();

}


// ===============================
// AUTO LOGIN
// ===============================

window.onload = function() {

  const saved =
    localStorage.getItem("openboxUser");

  if (saved) {

    try {

      const user =
        JSON.parse(saved);

      showDashboard(user);

    } catch (e) {

      localStorage.removeItem("openboxUser");

    }

  }

};

</script>

</body>
</html>
